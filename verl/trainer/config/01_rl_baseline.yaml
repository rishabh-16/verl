# RL baseline defaults for FST experiments.

defaults:

  - ppo_trainer

  - _self_

actor_rollout_ref:

  actor:

    ppo_mini_batch_size: 32

    clip_ratio_low: 1.0

    clip_ratio_high: 3.0

    policy_loss:

      loss_mode: cispo

  rollout:

    name: vllm

    n: 8

    calculate_log_probs: True

    tensor_model_parallel_size: 1

    val_kwargs:

      n: 4

data:

  train_batch_size: 32

algorithm:

  adv_estimator: grpo

  norm_adv_by_std_in_grpo: True

reward:

  reward_manager:

    name: naive

  reward_model:

    enable: False

trainer:

  project_name: FST

  save_freq: 50

  max_actor_ckpt_to_keep: null
